# Transfer learning: ImageNet-pretrained ResNet-50, two-stage fine-tuning.
run_name: resnet50
output_dir: artifacts
data:
  root: data
  dataset: oxford_pets
  img_size: 224
  val_fraction: 0.1
  num_workers: 4
model:
  name: resnet50
  pretrained: true
  dropout: 0.2
train:
  epochs: 12
  batch_size: 32
  lr: 1.0e-3            # head LR; backbone uses lr * backbone_lr_mult
  backbone_lr_mult: 0.1
  weight_decay: 1.0e-4
  label_smoothing: 0.1
  warmup_epochs: 1
  freeze_backbone_epochs: 1
  patience: 4
  amp: true
  seed: 42
tracking:
  mlflow: true
  mlflow_uri: file:./mlruns
  wandb: false
  experiment: oxford-pets
