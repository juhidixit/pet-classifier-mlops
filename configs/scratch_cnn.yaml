# Baseline: VGG-style CNN trained from random initialisation (no pretrained weights).
run_name: scratch_cnn
output_dir: artifacts
data:
  root: data
  dataset: oxford_pets
  img_size: 160
  val_fraction: 0.1
  num_workers: 4
model:
  name: scratch_cnn
  pretrained: false
  dropout: 0.3
train:
  epochs: 40
  batch_size: 64
  lr: 2.0e-3
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  warmup_epochs: 2
  freeze_backbone_epochs: 0
  patience: 10
  amp: true
  seed: 42
tracking:
  mlflow: true
  mlflow_uri: file:./mlruns
  wandb: false
  experiment: oxford-pets
